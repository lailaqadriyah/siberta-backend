openapi: 3.0.3
info:
  title: Siberta TA Submission API
  version: 1.0.0
  description: API specification for TA title submission, review, and admin workflows. ML service is external and consumed via simulate endpoint.
servers:
  - url: http://localhost:3000
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [mahasiswa, dosen, admin]
    Submission:
      type: object
      properties:
        id:
          type: integer
        student_id:
          type: integer
        title:
          type: string
        abstract:
          type: string
        status:
          type: string
          enum: [draft, submitted, revisi, setuju, ditolak, validated]
        similarity_score:
          type: number
          format: float
        created_at:
          type: string
          format: date-time
    Review:
      type: object
      properties:
        id:
          type: integer
        submission_id:
          type: integer
        reviewer_id:
          type: integer
        decision:
          type: string
          enum: [setuju, revisi, tolak]
        comment:
          type: string
        score:
          type: number
    Error:
      type: object
      properties:
        message:
          type: string
paths:
  /api/auth/login:
    post:
      summary: Login and receive JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/auth/me:
    get:
      summary: Get current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /api/submissions:
    post:
      summary: Create or submit a new submission (mahasiswa)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                abstract:
                  type: string
                submit:
                  type: boolean
      responses:
        '201':
          description: Created submission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
  /api/submissions/{id}:
    get:
      summary: Get submission by id
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Submission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
    put:
      summary: Update submission (student edits)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                abstract:
                  type: string
                submit:
                  type: boolean
      responses:
        '200':
          description: Updated
  /api/submissions/{id}/simulate:
    post:
      summary: Call ML service to compute SBERT similarity for a proposed title/abstract
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
      responses:
        '200':
          description: Similarity result
          content:
            application/json:
              schema:
                type: object
                properties:
                  similarity_score:
                    type: number
                    format: float
  /api/submissions/{id}/upload:
    post:
      summary: Upload supportive files for a submission
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: File uploaded
  /api/submissions/{id}/reviews:
    post:
      summary: Dosen posts a review/decision
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Review'
      responses:
        '201':
          description: Review created
  /api/admin/validate/{submissionId}:
    post:
      summary: Admin final validation of a submission
      security:
        - bearerAuth: []
      parameters:
        - name: submissionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Validated
  /api/admin/master-titles:
    get:
      summary: List master TA titles
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List
    post:
      summary: Create master title
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
      responses:
        '201':
          description: Created
  /api/admin/users:
    get:
      summary: List users (admin)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Users list
    post:
      summary: Create user
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                role:
                  type: string
      responses:
        '201':
          description: User created
